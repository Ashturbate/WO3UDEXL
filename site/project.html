<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091427">
  <meta name="description" content="Progress and screenshots for part of the Warriors Orochi 3 Ultimate Xtreme Legends mod.">
  <title>Project details — WO3U Xtreme Legends</title>
  <link rel="stylesheet" href="map.css?v=2">
</head>
<body>
  <header class="masthead">
    <a class="masthead-brand" href="index.html">
      <img src="assets/wo3u-xl-logo-trim.png" alt="Warriors Orochi 3 Ultimate Xtreme Legends">
      <span class="masthead-title">Project progress</span>
    </a>
    <nav class="masthead-nav" aria-label="Site">
      <a href="index.html#updates">Updates</a>
      <a href="https://github.com/ashimpure/WO3UDEXL">GitHub</a>
      <a class="suggest" href="https://github.com/ashimpure/WO3UDEXL/issues/new?template=tracker-update.yml">Suggest an update</a>
    </nav>
  </header>

  <main id="content" class="page" aria-live="polite">
    <p class="empty">Loading…</p>
  </main>

  <script src="map.js?v=2"></script>
  <script src="edit.js?v=1"></script>
  <script>
    const content = document.querySelector("#content");

    function renderStations(parent, items, color) {
      if (!items || !items.length) return;
      const section = el("section", "section");
      section.style.setProperty("--c", color);
      section.append(el("h2", "", "Parts of this area"));
      const list = el("ol", "stations");
      items.forEach((item) => {
        const li = el("li");
        const a = el("a", "", item.title);
        a.href = `project.html?id=${encodeURIComponent(item.id)}`;
        li.append(a, document.createTextNode(" "), el("span", "pct", `${STATE_LABELS[item.state]} · about ${item.progress}%`),
          el("p", "", item.summary));
        list.append(li);
      });
      section.append(list);
      parent.append(section);
    }

    function renderGallery(parent, shots, color) {
      if (!Array.isArray(shots) || !shots.length) return;
      const section = el("section", "section");
      section.style.setProperty("--c", color);
      section.append(el("h2", "", "Screenshots"));
      const gallery = el("div", "gallery");
      shots.forEach((shot) => {
        if (!shot || typeof shot.src !== "string" || !shot.src.startsWith("assets/screenshots/") || shot.src.includes("..")) return;
        const figure = el("figure");
        const img = el("img");
        img.src = shot.src;
        img.alt = shot.alt || "";
        img.loading = "lazy";
        figure.append(img, el("figcaption", "", shot.caption || ""));
        gallery.append(figure);
      });
      section.append(gallery);
      parent.append(section);
    }

    function renderWishlist(parent, groups) {
      if (!Array.isArray(groups) || !groups.length) return;
      const section = el("section", "section");
      section.append(el("h2", "", "On the wishlist"));
      section.append(el("p", "", "Characters that could join later. None of these are confirmed."));
      groups.forEach((group) => {
        if (!Array.isArray(group.characters) || !group.characters.length) return;
        const details = el("details");
        const summary = el("summary");
        summary.append(document.createTextNode(`${group.title} `), el("span", "", `· ${group.characters.length} ${group.characters.length === 1 ? "character" : "characters"}`));
        const names = el("ul", "names");
        group.characters.forEach((n) => names.append(el("li", "", n)));
        details.append(summary, names);
        section.append(details);
      });
      parent.append(section);
    }

    function render(item, parent, color) {
      document.title = `${item.title} — WO3U Xtreme Legends`;
      content.replaceChildren();
      content.style.setProperty("--c", color);
      const back = el("a", "back", parent ? `← ${parent.title}` : "← Project progress");
      back.href = parent ? `project.html?id=${encodeURIComponent(parent.id)}` : "index.html";
      content.append(back);

      const head = el("div", "detail-head");
      head.style.setProperty("--c", color);
            const title = el("div");
      const meta = el("p", "line-meta");
      meta.append(el("span", "status", STATE_LABELS[item.state]), document.createTextNode(` · ${item.area}`));
      title.append(el("h1", "", item.title), meta);
      head.append(title);
      content.append(head);

      const strip = el("div", "detail-strip");
      strip.append(makeStrip(item, color, item.substreams || []));
      content.append(strip);
      content.append(el("p", "detail-text", item.description || item.summary), makeNow(item, "detail-now"));

      renderStations(content, item.substreams, color);
      renderGallery(content, item.screenshots, color);
      renderWishlist(content, item.plannedGroups);
      content.append(el("p", "fine", "Progress figures are rough estimates, not release dates."));
      if (window.startEditMode) window.startEditMode(content, item.id, item);
    }

    const id = new URLSearchParams(location.search).get("id");
    if (!id) {
      content.replaceChildren(el("p", "empty", "This page needs a link from the progress map."));
    } else {
      loadTracker()
        .then((data) => {
          let found = null;
          data.streams.forEach((stream, i) => {
            const walk = (item, parent) => {
              if (item.id === id) found = { item, parent, color: lineColor(i) };
              (item.substreams || []).forEach((child) => walk(child, item));
            };
            walk(stream, null);
          });
          if (!found) {
            content.replaceChildren(el("p", "empty", "This part of the project couldn't be found. It may have been renamed."));
            return;
          }
          render(found.item, found.parent, found.color);
        })
        .catch((error) => content.replaceChildren(el("p", "load-error", `This page could not be loaded. ${error.message}`)));
    }
  </script>
</body>
</html>
