<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091427">
  <meta name="description" content="Follow progress on the Warriors Orochi 3 Ultimate Xtreme Legends mod.">
  <title>WO3U Xtreme Legends — Project progress</title>
  <link rel="stylesheet" href="map.css?v=2">
</head>
<body>
  <header class="masthead">
    <a class="masthead-brand" href="index.html">
      <img src="assets/wo3u-xl-logo-trim.png" alt="Warriors Orochi 3 Ultimate Xtreme Legends">
      <span class="masthead-title">Project progress</span>
    </a>
    <nav class="masthead-nav" aria-label="Site">
      <a href="#updates">Updates</a>
      <a href="https://github.com/ashimpure/WO3UDEXL">GitHub</a>
      <a href="https://discord.com/channels/606031682708963328/1555967493070393426">Discussion</a>
      <a class="suggest" href="https://github.com/ashimpure/WO3UDEXL/issues/new?template=tracker-update.yml">Suggest an update</a>
    </nav>
  </header>

  <main class="page">
    <section class="map-head" aria-labelledby="title">
      <div>
        <h1 id="title">Where the mod is at</h1>
        <p>A quick look at where each part of Xtreme Legends is at. Pick one for more detail and screenshots.</p>
      </div>
      </section>

    <ol id="lines" class="lines" aria-live="polite"></ol>

    <section id="updates" class="notes" aria-labelledby="updates-title">
      <h2 id="updates-title">Latest updates</h2>
      <ol id="timeline"></ol>
    </section>

    <p class="fine" id="as-of">Progress figures are rough estimates, not release dates.</p>
  </main>

  <script src="map.js?v=2"></script>
  <script>
    const lines = document.querySelector("#lines");

    function renderLine(stream, index) {
      const color = lineColor(index);
      const row = el("li", "line");
      row.style.setProperty("--c", color);

      const name = el("div", "line-name");
            const text = el("div");
      const h2 = el("h2");
      const link = el("a", "", stream.title);
      link.href = `project.html?id=${encodeURIComponent(stream.id)}`;
      h2.append(link);
      const meta = el("p", "line-meta");
      meta.append(el("span", "status", STATE_LABELS[stream.state]), document.createTextNode(` · ${stream.area}`));
      text.append(h2, meta);
      name.append(text);

      const body = el("div", "line-body");
      body.append(makeStrip(stream, color, stream.substreams || []), el("p", "", stream.summary), makeNow(stream, "now"));
      row.append(name, body);
      return row;
    }

    loadTracker()
      .then((data) => {
        data.streams.forEach((stream, i) => lines.append(renderLine(stream, i)));
        const timeline = document.querySelector("#timeline");
        [...data.updates].sort((a, b) => b.date.localeCompare(a.date)).forEach((update) => {
          const li = el("li");
          const time = el("time", "", formatDate(update.date));
          time.dateTime = update.date;
          const detail = el("div");
          detail.append(el("strong", "", update.title), el("p", "", update.detail));
          li.append(time, detail);
          timeline.append(li);
        });
        document.querySelector("#as-of").textContent =
          `Last updated ${formatDate(data.asOf)}. Progress figures are rough estimates, not release dates.`;
      })
      .catch((error) => lines.replaceChildren(el("li", "load-error", `The progress map could not be loaded. ${error.message}`)));
  </script>
</body>
</html>
